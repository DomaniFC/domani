<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>メンバー紹介 | DOMANI FC</title>

<style>

:root{
    --sky:#21C8D8;
    --sky-dark:#0CA8BA;
    --navy:#10203F;
    --red:#D61B4B;
    --gold:#FFD700;
    --white:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:linear-gradient(180deg,var(--sky),var(--sky-dark));
    min-height:100vh;
}

header{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:30px;
    border-bottom:6px solid var(--red);
}

header h1{
    font-size:3rem;
}

header p{
    margin-top:10px;
}

.menu{
    text-align:center;
    margin:30px;
}

.menu a{
    display:inline-block;
    background:var(--navy);
    color:white;
    text-decoration:none;
    padding:12px 30px;
    border-radius:30px;
    border:3px solid var(--red);
    font-weight:bold;
}

.menu a:hover{
    background:var(--red);
}

.member-container{

    width:95%;
    max-width:1400px;
    margin:auto;

    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

    gap:25px;
}

.member-card{

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.25);

    transition:0.3s;
}

.member-card:hover{
    transform:translateY(-8px);
}

.card-header{

    background:var(--navy);

    color:white;

    padding:20px;
    text-align:center;
    position:relative;
}

.number{

    position:absolute;
    left:15px;
    top:10px;

    font-size:2.8rem;
    font-weight:bold;
    color:var(--gold);
}

.name{
    font-size:1.5rem;
    font-weight:bold;
    margin-top:10px;
}

.position{

    margin-top:5px;

    display:inline-block;

    background:var(--red);

    padding:6px 15px;

    border-radius:20px;

    font-weight:bold;
}

.card-body{
    padding:20px;
}

.info{
    display:flex;
    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #eee;
}

.label{
    font-weight:bold;
    color:#666;
}

.value{
    color:#000;
    font-weight:bold;
}

.recruit{
    background:linear-gradient(
        45deg,
        #ff6b6b,
        #ffb347
    );
}

.recruit .position{
    background:#ffffff;
    color:#ff6b6b;
}

footer{
    margin-top:50px;

    background:var(--navy);

    color:white;

    text-align:center;

    padding:20px;
}

@media(max-width:768px){

    header h1{
        font-size:2rem;
    }

    .member-container{
        width:92%;
    }

}

</style>
</head>
<body>

<header>
    <h1>DOMANI FC</h1>
    <p>メンバー紹介</p>
</header>

<div class="menu">
    index.htmlトップページへ戻る</a>
</div>

<div class="member-container">

    <!-- GK -->

    <div class="member-card">
        <div class="card-header">
            <div class="number">1</div>
            <div class="name">石川兼次</div>
            <div class="position">GK</div>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">👕 上</span><span class="value">5L</span></div>
            <div class="info"><span class="label">🩳 下</span><span class="value">5L</span></div>
            <div class="info"><span class="label">🧦 ソックス</span><span class="value">27-29</span></div>
        </div>
    </div>

    <div class="member-card">
        <div class="card-header">
            <div class="number">2</div>
            <div class="name">織田豊久</div>
            <div class="position">FW</div>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">👕 上</span><span class="value">M</span></div>
            <div class="info"><span class="label">🩳 下</span><span class="value">M</span></div>
            <div class="info"><span class="label">🧦 ソックス</span><span class="value">25-27</span></div>
        </div>
    </div>

    <div class="member-card">
        <div class="card-header">
            <div class="number">3</div>
            <div class="name">長谷川隼人</div>
            <div class="position">FW</div>
        </div>
        <div class="card-body">
            <div class="info"><span class="label">👕 上</span><span class="value">M</span></div>
            <div class="info"><span class="label">🩳 下</span><span class="value">L</span></div>
            <div class="info"><span class="label">🧦 ソックス</span><span class="value">25-27</span></div>
        </div>
    </div>

    <!-- 募集中 -->

    <div class="member-card recruit">
        <div class="card-header recruit">
            <div class="number">16</div>
            <div class="name">募集中</div>
            <div class="position">NEW MEMBER</div>
        </div>

        <div class="card-body">
            <div class="info"><span class="label">ポジション</span><span class="value">ALL</span></div>
            <div class="info"><span class="label">ユニフォーム</span><span class="value">L</span></div>
            <div class="info"><span class="label">参加者募集中</span><span class="value">⚽</span></div>
        </div>
    </div>

</div>

<footer>
© 2026 DOMANI FC
</footer>

</body>
</html>
