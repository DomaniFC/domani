<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>メンバー紹介 | DOMANI FC</title>

<style>

:root{
    --sky:#21C8D8;
    --sky-dark:#0CA8BA;
    --navy:#10203F;
    --red:#D61B4B;
    --gold:#FFD700;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:linear-gradient(180deg,var(--sky),var(--sky-dark));
    min-height:100vh;
}

header{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:30px;
    border-bottom:6px solid var(--red);
}

header h1{
    font-size:3rem;
}

header p{
    margin-top:10px;
}

.menu{
    text-align:center;
    margin:25px;
}

.menu a{
    display:inline-block;
    background:var(--navy);
    color:white;
    text-decoration:none;
    padding:12px 30px;
    border-radius:30px;
    border:3px solid var(--red);
    font-weight:bold;
}

.menu a:hover{
    background:var(--red);
}

.member-container{
    width:95%;
    max-width:1500px;
    margin:auto;

    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:25px;

    padding-bottom:50px;
}

.member-card{
    background:white;
    border-radius:20px;
    overflow:hidden;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);

    transition:.3s;
}

.member-card:hover{
    transform:translateY(-5px);
}

.card-header{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:20px;
    position:relative;
}

.number{
    position:absolute;
    left:15px;
    top:5px;

    font-size:3rem;
    font-weight:bold;

    color:var(--gold);
}

.name{
    font-size:1.5rem;
    font-weight:bold;
    margin-top:10px;
}

.position{
    display:inline-block;

    margin-top:10px;

    background:var(--red);

    padding:5px 15px;

    border-radius:30px;

    font-weight:bold;
}

.gk .card-header{
    background:#8A6C00;
}

.card-body{
    padding:20px;
}

.info{
    display:flex;
    justify-content:space-between;

    padding:10px 0;

    border-bottom:1px solid #eee;
}

.label{
    color:#666;
    font-weight:bold;
}

.value{
    font-weight:bold;
}

.recruit .card-header{
    background:linear-gradient(
        45deg,
        #ff7f50,
        #ffb347
    );
}

.recruit .position{
    background:white;
    color:#ff7f50;
}

footer{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:20px;
}

@media(max-width:768px){

    header h1{
        font-size:2rem;
    }
}

</style>
</head>

<body>

<header>
    <h1>DOMANI FC</h1>
    <p>メンバー紹介</p>
</header>

<div class="menu">
    <a href="index.html">トップ</a>
</div>

<div id="members" class="member-container"></div>

<footer>
© 2026 DOMANI FC
</footer>

<script>

const members = [
    {no:1,name:"石川 兼次",pos:"GK",top:"5L",bottom:"5L",sock:"27-29"},

    {no:4,name:"城 浩晃",pos:"FE",top:"L",bottom:"L",sock:"25-27"},
    {no:5,name:"佐久間 正俊",pos:"FE",top:"4L",bottom:"3L",sock:"25-27"},
    {no:6,name:"崎畑 優一",pos:"FE",top:"L",bottom:"L",sock:"25-27"},
    {no:7,name:"橋本 亮介",pos:"FE",top:"M",bottom:"L",sock:"25-27"},
    {no:8,name:"坂井 真一",pos:"FE",top:"2L",bottom:"L",sock:"25-27"},
    {no:9,name:"山崎 剛",pos:"FE",top:"L",bottom:"L",sock:"25-27"},
    {no:10,name:"友松 厚",pos:"FE",top:"L",bottom:"L",sock:"25-27"},
    {no:11,name:"杉藤 和夫",pos:"FE",top:"2L",bottom:"L",sock:"25-27"},
    {no:12,name:"細田 直見",pos:"FE",top:"L",bottom:"L",sock:"25-27"},
    {no:13,name:"早川 典孝",pos:"FE",top:"L",bottom:"L",sock:"25-27"},

    {no:17,name:"乙部 祐樹",pos:"FE",top:"L",bottom:"L",sock:"25-27"},

    {no:19,name:"募集中",pos:"NEW MEMBER",top:"L",bottom:"L",sock:"25-27"},

    {no:99,name:"伊藤 丘",pos:"FE",top:"L",bottom:"L",sock:"25-27"}

const container = document.getElementById("members");

members.forEach(m => {
   const isRecruit = m.name === "募集中";
   const isGK = m.pos === "GK";
   const card = document.createElement("div");

   card.className =
      "member-card " +
      (isRecruit ? "recruit" : "") +
      (isGK ? " gk" : "");

   card.innerHTML = `
      <div class="card-header">
         <div class="number">${m.no}</div>
         <div class="name">${m.name}</div>
         <div class="position">${m.pos}</div>
      </div>

      <div class="card-body">
         <div class="info">
            <span class="label">👕 上</span>
            <span class="value">${m.top || "-"}</span>
         </div>

         <div class="info">
            <span class="label">🩳 下</span>
            <span class="value">${m.bottom || "-"}</span>
         </div>

         <div class="info">
            <span class="label">🧦 ソックス</span>
            <span class="value">${m.sock || "-"}</span>
         </div>

      </div>
   `;

   container.appendChild(card);

});

</script>

</body>
</html>
