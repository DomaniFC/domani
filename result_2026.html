<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>試合結果 | DOMANI FC</title>

<style>
:root{
    --sky:#21C8D8;
    --sky-dark:#0CA8BA;
    --navy:#10203F;
    --red:#D61B4B;
    --gold:#FFD700;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:linear-gradient(
        180deg,
        var(--sky),
        var(--sky-dark)
    );
    min-height:100vh;
}

header{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:30px;
    border-bottom:6px solid var(--red);
}

header h1{
    font-size:3rem;
}

header p{
    margin-top:10px;
}

.menu{
    text-align:center;
    margin:25px;
}

.menu a{
    display:inline-block;
    background:var(--navy);
    color:white;
    text-decoration:none;
    padding:12px 30px;
    border-radius:30px;
    border:3px solid var(--red);
    font-weight:bold;
    transition:0.3s;
}

.menu a:hover{
    background:var(--red);
}

.result-table{
    width:95%;
    max-width:1200px;
    margin:30px auto 50px;

    border-collapse:collapse;

    background:white;

    border-radius:15px;
    overflow:hidden;

    box-shadow:
        0 10px 25px rgba(0,0,0,.25);
}

.result-table th{
    background:var(--navy);
    color:white;
    padding:14px;
}

.result-table td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

.result-table tr:nth-child(even){
    background:#f5f5f5;
}

.result-table tr:hover{
    background:#eef8ff;
}

.win{
    color:#008000;
    font-size:1.3rem;
    font-weight:bold;
}

.draw{
    color:#ff8c00;
    font-size:1.3rem;
    font-weight:bold;
}

.lose{
    color:#d00000;
    font-size:1.3rem;
    font-weight:bold;
}

footer{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:20px;
    border-top:4px solid var(--red);
}

@media(max-width:768px){

    header h1{
        font-size:2rem;
    }

    .result-table{
        font-size:0.9rem;
    }

    .result-table th,
    .result-table td{
        padding:8px;
    }
}
</style>

</head>

<body>

<header>
    <h1>DOMANI FC</h1>
    <p>試合結果</p>
</header>

<div class="menu">
    <a href="index.html">トップ</a>
</div>

<table class="result-table">

    <thead>
        <tr>
            <th>日付</th>
            <th>大会・内容</th>
            <th>対戦相手</th>
            <th>スコア</th>
            <th>結果</th>
            <th>通算</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>07/26</td>
            <td>シニアリーグ第３節</td>
            <td>？？？</td>
            <td>2-0</td>
            <td class="win">○</td>
            <td>1勝0敗0分</td>
        </tr>

        <tr>
            <td>09/27</td>
            <td>シニアリーグ第４節</td>
            <td>？？？</td>
            <td>1-2</td>
            <td class="lose">×</td>
            <td>1勝1敗0分</td>
        </tr>

        <tr>
            <td>10/25</td>
            <td>シニアリーグ第５節</td>
            <td>？？？</td>
            <td></td>
            <td class="draw">△</td>
            <td>1勝1敗1分</td>
        </tr>
    </tbody>

</table>

<footer>
    © 2026 DOMANI FC
</footer>

</body>

</html>
