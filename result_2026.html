<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>試合結果 | DOMANI FC</title>

<style>

:root{
    --sky:#21C8D8;
    --sky-dark:#0CA8BA;
    --navy:#10203F;
    --red:#D61B4B;
    --white:#FFFFFF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:linear-gradient(
        180deg,
        var(--sky),
        var(--sky-dark)
    );
    min-height:100vh;
}

header{
    background:var(--navy);
    color:white;
    text-align:center;
    padding:30px;
    border-bottom:6px solid var(--red);
}

header h1{
    font-size:3rem;
}

.menu{
    text-align:center;
    margin:25px;
}

.menu a{
    display:inline-block;
    background:var(--navy);
    color:white;
    text-decoration:none;
    padding:12px 30px;
    border-radius:30px;
    border:3px solid var(--red);
    font-weight:bold;
}

.results{
    width:95%;
    max-width:1000px;
    margin:auto;
}

.match-card{

    background:white;

    border-radius:20px;

    margin-bottom:25px;

    overflow:hidden;

    box-shadow:
        0 10px 20px rgba(0,0,0,0.2);
}

.match-header{

    background:var(--navy);

    color:white;

    padding:15px;
}

.match-date{
    font-size:0.9rem;
}

.match-title{
    font-size:1.3rem;
    font-weight:bold;
    margin-top:5px;
}

.score{

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    font-size:2rem;
    font-weight:bold;
}

.team{
    flex:1;
    text-align:center;
}

.vs{
    margin:0 20px;
    color:#888;
}

.win{
    color:#008000;
}

.lose{
    color:#d00000;
}

.draw{
    color:#ff8c00;
}

.match-detail{
    padding:20px;
    border-top:1px solid #ddd;
}

footer{
    margin-top:40px;
    background:var(--navy);
    color:white;
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<header>
    <h1>DOMANI FC</h1>
    <p>試合結果</p>
</header>

<div class="menu">
    <a href="index.html">🏠 トップページへ戻る

<div class="results">

    <!-- 試合1 -->

    <div class="match-card">

        <div class="match-header">
            <div class="match-date">2026/09/27</div>
            <div class="match-title">春日井リーグ 第5節</div>
        </div>

        <div class="score">

            <div class="team">
                DOMANI FC
            </div>

            <div class="win">
                3 - 1
            </div>

            <div class="team">
                FC SAMPLE
            </div>

        </div>

        <div class="match-detail">
            得点者：角田智哉×2、伊藤丘×1
        </div>

    </div>

    <!-- 試合2 -->

    <div class="match-card">

        <div class="match-header">
            <div class="match-date">2026/09/20</div>
            <div class="match-title">練習試合</div>
        </div>

        <div class="score">

            <div class="team">
                DOMANI FC
            </div>

            <div class="draw">
                2 - 2
            </div>

            <div class="team">
                CITY FC
            </div>

        </div>

        <div class="match-detail">
            得点者：友松厚、杉藤輝
        </div>

    </div>

    <!-- 試合3 -->

    <div class="match-card">

        <div class="match-header">
            <div class="match-date">2026/09/13</div>
            <div class="match-title">春日井リーグ 第4節</div>
        </div>

        <div class="score">

            <div class="team">
                DOMANI FC
            </div>

            <div class="lose">
                0 - 1
            </div>

            <div class="team">
                UNITED FC
            </div>

        </div>

        <div class="match-detail">
            MVP：石川兼次
        </div>

    </div>

</div>

<footer>
© 2026 DOMANI FC
</footer>

</body>
</html>
