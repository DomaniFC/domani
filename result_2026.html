<style>
:root{

--navy:#10203F;
--red:#D61B4B;
--gold:#FFD700;
}
 
*{
margin:0;
padding:0;
box-sizing:border-box;
}
 
body{
font-family:"Yu Gothic","Meiryo",sans-serif;
background:linear-gradient(
180deg,
var(--sky),
var(--sky-dark)
);
min-height:100vh;
}
 
header{
background:var(--navy);
color:white;
text-align:center;
padding:30px;
border-bottom:6px solid var(--red);
}
 
header h1{
font-size:3rem;
}
 
header p{
margin-top:10px;
}
 
.menu{
text-align:center;
margin:25px;
}
 
.menu a{
display:inline-block;
background:var(--navy);
color:white;
text-decoration:none;
padding:12px 30px;
border-radius:30px;
border:3px solid var(--red);
font-weight:bold;
transition:0.3s;
}
 
.menu a:hover{
background:var(--red);
}
 
/* 試合結果テーブル */
 
.result-table{
width:95%;
max-width:1200px;
margin:30px auto 50px;
 
border-collapse:collapse;
 
background:white;
 
border-radius:15px;
overflow:hidden;
 
box-shadow:
0 10px 25px rgba(0,0,0,.25);
}
 
.result-table th{
background:var(--navy);
color:white;
padding:14px;
border:1px solid #ddd;
}
 
.result-table td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}
 
.result-table tr:nth-child(even){
background:#f5f5f5;
}
 
.result-table tr:hover{
background:#eef8ff;
}
 
.win{
color:#008000;
font-size:1.3rem;
font-weight:bold;
}
 
.draw{
color:#ff8c00;
font-size:1.3rem;
font-weight:bold;
}
 
.lose{
color:#d00000;
font-size:1.3rem;
font-weight:bold;
}
 
footer{
background:var(--navy);
color:white;
text-align:center;
padding:20px;
border-top:4px solid var(--red);
}
 
@media(max-width:768px){
 
header h1{
font-size:2rem;
}
 
.result-table{
font-size:0.9rem;
}
 
.result-table th,
.result-table td{
padding:8px;
}
}
