<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="K1m7Qui06YtYaeReMdRa_FLEbcq19y0qEGtGdb7Z60k" />
<meta name="google-site-verification" content="ドマーニFC">
<meta name="description"content="ドマーニFC公式サイト。活動予定、試合結果、メンバー紹介を掲載しています。">

<title>ドマーニFC</title>

<style>
:root {
    --main-color: #21C8D8;
    --main-dark: #0CA8BA;
    --navy: #10203F;
    --red: #D61B4B;
    --white: #FFFFFF;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(
        180deg,
        var(--main-color),
        var(--main-dark)
    );
    text-align: center;
    color: var(--white);
    min-height: 100vh;
}

header {
    background-color: var(--navy);
    padding: 25px 10px;
    border-bottom: 6px solid var(--red);
}

h1 {
    font-size: 3rem;
    letter-spacing: 3px;
}

.subtitle {
    margin-top: 10px;
    font-size: 1.1rem;
}

/* 写真 */
.team-photo {
    width: 700px;
    max-width: 90%;
    margin: 40px auto;
    display: block;
    border-radius: 15px;
    border: 5px solid var(--navy);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.menu-link {
    font-size: 2rem;
    letter-spacing: 3px;
}

.calendar-title {
    font-size: 2rem;
    letter-spacing: 3px;
}

/* カレンダー */
.calendar-container {
    width: 700px;
    max-width: 90%;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 15px;
    overflow: hidden;
    border: 5px solid var(--navy);
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.calendar-title {
    background-color: var(--navy);
    color: white;
    padding: 15px;
    font-size: 1.5rem;
    font-weight: bold;
    border-bottom: 5px solid var(--red);
}

.calendar-frame {
    width: 100%;
    height: 700px;
    border: none;
    display: block;
}

footer {
    margin-top: 40px;
    padding: 20px;

    background-color: var(--navy);
    border-top: 4px solid var(--red);
}

/* スマホ表示 */
@media (max-width: 768px) {

    h1 {
        font-size: 2rem;
    }

    .subtitle {
        font-size: 1rem;
    }

    .calendar-frame {
        height: 500px;
    }
}

@media (max-width: 480px) {

    .calendar-frame {
        height: 450px;
    }

    .calendar-title {
        font-size: 1.2rem;
    }
}

</style>
</head>

<body>

<header>
    <h1>ドマーニFC公式サイト(工事中)</h1>
</header>

<img
    src="./image/260927.jpg"
    alt="ドマーニFC"
    class="team-photo">

<div class="menu-link">
    <a href="member.html">メンバー紹介はこちら＞＞</a>
</div>

<div class="menu-link">
    <a href="result_2026.html">2026年 試合結果＞＞</a>
</div>

<div class="calendar-container">
    <div class="calendar-title">活動カレンダー
    </div>
    <iframe
        class="calendar-frame"
        src="https://calendar.google.com/calendar/embed?src=domanisoccer%40gmail.com&ctz=Asia%2FTokyo"
        frameborder="0"
        scrolling="no">
    </iframe>
</div>

<footer>
    © 2026 DOMANI FC
</footer>

</body>
</html>
