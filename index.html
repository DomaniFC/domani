<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ドマーニFC</title>

<style>
:root {
    --main-color: #21c8d8;
    --main-dark: #0ca8ba;
    --navy: #10203f;
    --red: #d61b4b;
    --white: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(
        180deg,
        var(--main-color),
        var(--main-dark)
    );
    text-align: center;
    color: var(--white);
}

/* ヘッダー */
header {
    background-color: var(--navy);
    padding: 25px 10px;
    border-bottom: 6px solid var(--red);
}

h1 {
    font-size: 3rem;
    letter-spacing: 3px;
}

.subtitle {
    margin-top: 10px;
    font-size: 1.1rem;
}

/* メイン画像 */
.team-photo {
    width: 700px;
    max-width: 90%;
    margin: 40px auto;
    display: block;

    border-radius: 15px;
    border: 5px solid var(--navy);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.3);
}

/* カレンダーエリア */
.schedule {
    width: 95%;
    max-width: 1000px;

    margin: 40px auto;

    background: #ffffff;
    border-radius: 15px;
    overflow: hidden;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.25);
}

.schedule-title {
    background-color: var(--navy);
    color: white;

    padding: 15px;
    font-size: 1.5rem;
    font-weight: bold;

    border-bottom: 5px solid var(--red);
}

.calendar-frame {
    width: 100%;
    height: 700px;
    border: none;
}

/* フッター */
footer {
    margin-top: 30px;
    padding: 20px;

    background-color: var(--navy);
    border-top: 4px solid var(--red);
}

@media (max-width: 768px) {

    h1 {
        font-size: 2rem;
    }

    .calendar-frame {
        height: 500px;
    }
}
</style>

</head>

<body>

<header>
    <h1>DOMANI FC</h1>
    <p class="subtitle">ドマーニFC公式サイト</p>
</header>

<img
    src="260927.jpg"
    alt="ドマーニFCユニフォーム"
    class="team-photo"
>

<div class="schedule">
    <div       class="calendar-frame"
        src="https://calendar.google.com/calendar/embed?src=domanisoccer%40gmail.com&ctz=Asia%2FTokyo">
    </iframe>
</div>

<footer>
    © 2026 DOMANI FC
</footer>

</body>
</html>
